  test-net9:
    name: Run Tests (.NET 9)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Select .NET 9 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content global.json

          dotnet --version

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Restore tests
        run: dotnet restore

      - name: Run tests
        run: >
          dotnet test
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true


  test-net10:
    name: Run Tests (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select .NET 10 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content global.json

          dotnet --version

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Restore tests
        run: dotnet restore

      - name: Run tests
        run: >
          dotnet test
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true


  pack:
    name: Create NuGet Packages
    runs-on: windows-latest

    needs:
      - build-android-net9
      - build-android-net10
      - build-windows-net9
      - build-windows-net10
      - build-apple-net9
      - build-apple-net10
      - test-net9
      - test-net10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select .NET 10 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content global.json

          dotnet --version

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Windows workload
        run: dotnet workload install maui-windows

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet workload list

      - name: Pack NuGet package
        run: >
          dotnet pack
          -c Release
          -p:ContinuousIntegrationBuild=true

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            **/bin/Release/*.nupkg
            **/bin/Release/*.snupkg