          -f net10.0-windows10.0.19041.0
          --no-restore
          -p:ContinuousIntegrationBuild=true


  build-apple-net9:
    name: Build Apple Platforms (.NET 9)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Select .NET 9 SDK
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          EOF

          dotnet --version

      - name: Install Apple workloads
        run: dotnet workload install ios maccatalyst

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet workload list
          xcodebuild -version

      - name: Restore iOS
        run: dotnet restore -p:TargetFramework=net9.0-ios18.0

      - name: Build iOS
        run: >
          dotnet build
          -c Release
          -f net9.0-ios18.0
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Restore Mac Catalyst
        run: dotnet restore -p:TargetFramework=net9.0-maccatalyst18.0

      - name: Build Mac Catalyst
        run: >
          dotnet build
          -c Release
          -f net9.0-maccatalyst18.0
          --no-restore
          -p:ContinuousIntegrationBuild=true


