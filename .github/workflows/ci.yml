    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select .NET 10 SDK
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
