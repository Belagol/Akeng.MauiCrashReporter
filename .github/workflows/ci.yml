name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:

  build-android-net9:
    name: Build Android (.NET 9)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Select .NET 9 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content global.json

          dotnet --version

      - name: Install Android workload
        run: dotnet workload install android

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet workload list

      - name: Restore Android
        run: dotnet restore -p:TargetFramework=net9.0-android35.0

      - name: Build Android
        run: >
          dotnet build
          -c Release
          -f net9.0-android35.0
          --no-restore
          -p:ContinuousIntegrationBuild=true


  build-android-net10:
    name: Build Android (.NET 10)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select .NET 10 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content global.json

          dotnet --version

      - name: Install Android workload
        run: dotnet workload install android

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet workload list

      - name: Restore Android
        run: dotnet restore -p:TargetFramework=net10.0-android36.0

      - name: Build Android
        run: >
          dotnet build
          -c Release
          -f net10.0-android36.0
          --no-restore
          -p:ContinuousIntegrationBuild=true


  build-windows-net9:
    name: Build Windows (.NET 9)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
