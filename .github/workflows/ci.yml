      - name: Select .NET 9 SDK
        shell: pwsh
        run: |
          @'
          {
            "sdk": {
              "version": "9.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          '@ | Set-Content global.json

          dotnet --version

      - name: Install Windows workload
        run: dotnet workload install maui-windows

      - name: Show environment
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet workload list

      - name: Restore Windows
        run: dotnet restore -p:TargetFramework=net9.0-windows10.0.19041.0

      - name: Build Windows
        run: >
          dotnet build
          -c Release
          -f net9.0-windows10.0.19041.0
          --no-restore
          -p:ContinuousIntegrationBuild=true


  build-windows-net10:
    name: Build Windows (.NET 10)
